<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>black-todo • Give to Jarvis Modal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000000;
      color: #EAEAEA;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="min-h-screen p-8 flex justify-center items-start bg-black">

  <div class="w-full max-w-lg flex flex-col gap-6 mt-4 opacity-30 pointer-events-none">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-6 h-6 flex items-center justify-center bg-white rounded-md">
          <span class="font-mono text-xs font-black text-black">N</span>
        </div>
        <div class="flex flex-col">
          <span class="text-[11px] font-bold tracking-[0.3em] uppercase text-[#EAEAEA]">NEUVERA</span>
        </div>
      </div>
    </div>
    <div class="flex flex-col gap-2">
      <div class="p-3 rounded-xl bg-[#0A0A0A] border border-[#1A1A1A]">
        <span class="text-sm text-[#EAEAEA]">Build & test Reel Intercept model with mascot nudges</span>
      </div>
    </div>
  </div>

  <!-- PROMPT REVIEW MODAL -->
  <div class="fixed inset-0 bg-black/85 backdrop-blur-[3px] z-50 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-[#0A0A0A] border border-[#222222] rounded-2xl p-6 flex flex-col gap-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-[#1A1A1A] pb-3">
        <div class="flex items-center gap-2">
          <span class="font-mono text-xs font-semibold text-white tracking-wide">⚡ GIVE TO JARVIS</span>
        </div>
        <span class="text-[#666666] hover:text-white cursor-pointer text-lg leading-none">&times;</span>
      </div>

      <div class="flex flex-col gap-1.5">
        <span class="text-[10px] font-mono uppercase tracking-wider text-[#666666]">Task</span>
        <span class="text-sm font-semibold text-[#EAEAEA]">Build & test Reel Intercept model with mascot nudges</span>
      </div>

      <div class="flex flex-col gap-1.5">
        <span class="text-[10px] font-mono uppercase tracking-wider text-[#666666]">Prompt / Instructions for Agent</span>
        <textarea rows="4" class="w-full bg-[#111111] border border-[#262626] rounded-lg p-3 text-xs text-[#EAEAEA] font-mono leading-relaxed focus:border-white focus:outline-none resize-none">Implement background accessibility broadcast receiver in useNativeReelBridge.ts, connect mascot emotional expressions (Ferro, Kobi), and verify zero build errors.</textarea>
      </div>

      <div class="flex items-center gap-2 pt-2 border-t border-[#1A1A1A]">
        <button class="flex-1 py-2.5 rounded-lg bg-white text-black font-semibold text-xs hover:bg-[#D5D5D5] transition-colors cursor-pointer flex items-center justify-center gap-1.5">
          <span>⚡</span>
          <span>Execute with Jarvis</span>
        </button>
        <button class="py-2.5 px-4 rounded-lg bg-[#141414] border border-[#262626] text-[#888888] hover:text-white transition-colors text-xs cursor-pointer">
          Cancel
        </button>
      </div>
    </div>
  </div>

</body>
</html>
