<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>black-todo • Right Drawer Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000000;
      color: #EAEAEA;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
      overflow: hidden;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="min-h-screen p-8 flex justify-center items-start bg-black relative">

  <!-- Background Dimmed Context -->
  <div class="w-full max-w-lg flex flex-col gap-6 mt-4 opacity-25">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 flex items-center justify-center bg-white rounded-md">
          <span class="font-mono text-xs font-black text-black">N</span>
        </div>
        <span class="text-[11px] font-bold tracking-[0.3em] uppercase text-[#EAEAEA]">NEUVERA</span>
      </div>
    </div>
    <div class="flex flex-col gap-2">
      <div class="p-3 rounded-xl bg-[#0A0A0A] border border-[#1A1A1A]">
        <span class="text-sm text-[#EAEAEA]">Build & test Reel Intercept model with mascot nudges</span>
      </div>
    </div>
  </div>

  <!-- Shared Backdrop -->
  <div class="fixed inset-0 bg-black/80 backdrop-blur-[2px] z-40"></div>

  <!-- RIGHT INPUT DRAWER (OPEN) -->
  <div class="fixed top-0 right-0 bottom-0 w-full max-w-md bg-[#090909] border-l border-[#1F1F1F] z-50 p-6 flex flex-col justify-between shadow-2xl">
    <div class="flex flex-col gap-5">
      <div class="flex items-center justify-between border-b border-[#1A1A1A] pb-3.5">
        <div class="flex items-center gap-2">
          <div class="w-5 h-5 rounded flex items-center justify-center bg-white text-black">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </div>
          <span class="font-mono text-xs font-semibold text-white tracking-wider">JARVIS DISPATCH</span>
        </div>
        <span class="text-[#666666] hover:text-white cursor-pointer p-1 text-base">&times;</span>
      </div>

      <!-- Task info card -->
      <div class="flex flex-col gap-1.5 p-3 rounded-xl bg-[#111111] border border-[#1E1E1E]">
        <div class="flex items-center justify-between text-[10px] font-mono text-[#666666]">
          <span>TARGET TASK</span>
          <span class="text-white font-medium">NEUVERA</span>
        </div>
        <span class="text-sm font-semibold text-[#EAEAEA] leading-snug">Build & test Reel Intercept model with mascot nudges</span>
      </div>

      <!-- Prompt / Directive -->
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-mono uppercase tracking-wider text-[#666666]">Prompt / Agent Directive</span>
          <span class="text-[10px] font-mono text-[#555555]">Autonomous Coding Agent</span>
        </div>
        <textarea rows="6" class="w-full bg-[#111111] border border-[#222222] focus:border-white rounded-xl p-3 text-xs text-[#EAEAEA] font-mono leading-relaxed focus:outline-none resize-none">Implement background accessibility broadcast receiver in useNativeReelBridge.ts, connect mascot emotional expressions (Ferro, Kobi), and run typecheck.</textarea>
      </div>

      <!-- Execution parameters -->
      <div class="flex flex-col gap-2 pt-2 border-t border-[#161616]">
        <div class="flex items-center justify-between text-[11px] font-mono">
          <span class="text-[#777777]">Sandbox Target</span>
          <span class="text-[#CCCCCC]">c:\...\black-todo</span>
        </div>
        <div class="flex items-center justify-between text-[11px] font-mono">
          <span class="text-[#777777]">Strict Typecheck & Build</span>
          <span class="text-white">Enabled (0 errors)</span>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2 pt-4 border-t border-[#1A1A1A]">
      <button class="flex-1 py-2.5 rounded-xl bg-white text-black font-semibold text-xs hover:bg-[#D5D5D5] transition-colors cursor-pointer flex items-center justify-center gap-1.5 font-mono">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span>Execute with Jarvis</span>
      </button>
      <button class="py-2.5 px-4 rounded-xl bg-[#141414] border border-[#262626] text-[#888888] hover:text-white transition-colors text-xs cursor-pointer font-mono">
        Cancel
      </button>
    </div>
  </div>

</body>
</html>
